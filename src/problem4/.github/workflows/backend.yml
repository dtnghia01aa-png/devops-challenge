name: backend

on:
  push: { branches: [main], paths: ['backend/**'] }
  pull_request: { paths: ['backend/**'] }

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build && echo "$GITHUB_SHA" > dist/VERSION
      - run: npm prune --omit=dev && zip -qr ../backend.zip dist node_modules package.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: backend, path: backend.zip }

  staging:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency: backend-staging
    permissions: { id-token: write }
    env: &env
      ASG: ${{ vars.ASG_NAME }}
      TEMPLATE: ${{ vars.LAUNCH_TEMPLATE_ID }}
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      API_URL: ${{ vars.API_URL }}
    steps: &deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: backend }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE }}', aws-region: '${{ vars.AWS_REGION }}' }
      - name: Deploy (new servers boot this build; old ones stop once the new ones are healthy)
        run: |
          src="s3://$BUCKET/backend/$GITHUB_SHA.zip"
          aws s3 cp backend.zip "$src"
          boot="#!/bin/bash
          aws s3 cp $src /tmp/a.zip && unzip -q /tmp/a.zip -d /opt/api && systemctl enable --now api"
          v=$(aws ec2 create-launch-template-version --launch-template-id "$TEMPLATE" --source-version "\$Latest" \
            --launch-template-data "{\"UserData\":\"$(base64 -w0 <<< "$boot")\"}" \
            --query LaunchTemplateVersion.VersionNumber --output text)
          id=$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG" \
            --desired-configuration "{\"LaunchTemplate\":{\"LaunchTemplateId\":\"$TEMPLATE\",\"Version\":\"$v\"}}" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"AutoRollback":true}' \
            --query InstanceRefreshId --output text)
          until s=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG" \
            --instance-refresh-ids "$id" --query 'InstanceRefreshes[0].Status' --output text)
            [[ $s =~ ^(Successful|Failed|Cancelled|Rollback) ]]; do sleep 15; done
          [ "$s" = Successful ]
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-all-errors "$API_URL/healthz" | grep -q "$GITHUB_SHA"

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency: backend-production
    permissions: { id-token: write }
    env: *env
    steps: *deploy
