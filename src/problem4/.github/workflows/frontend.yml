name: frontend

on:
  push: { branches: [main], paths: ['frontend/**'] }
  pull_request: { paths: ['frontend/**'] }

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: frontend, path: frontend/dist, if-no-files-found: error }

  staging:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency: frontend-staging
    permissions: { id-token: write }
    env: &env
      BUCKET: ${{ vars.SITE_BUCKET }}
      CDN: ${{ vars.CLOUDFRONT_DISTRIBUTION }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps: &deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: frontend, path: dist }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE }}', aws-region: '${{ vars.AWS_REGION }}' }
      - name: Deploy (index.html last, so the live page never points at a missing file)
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist "s3://$BUCKET" --recursive --exclude 'assets/*' --exclude index.html --cache-control no-cache
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control no-cache
          id=$(aws cloudfront create-invalidation --distribution-id "$CDN" --paths / /index.html \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$CDN" --id "$id"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-all-errors "$SITE_URL/" | cmp - dist/index.html

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency: frontend-production
    permissions: { id-token: write }
    env: *env
    steps: *deploy
